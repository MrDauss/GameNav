name: Build GameNav APK (Audited)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: gamenav-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout GameNav
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Verify toolchain
        run: |
          set -euo pipefail
          java -version
          flutter --version
          dart --version

      - name: Generate Android shell safely
        run: |
          set -euo pipefail
          rm -rf /tmp/gamenav_android_shell
          flutter create \
            --platforms=android \
            --org=com.gamenav \
            --project-name=gamenav \
            /tmp/gamenav_android_shell

          rm -rf android
          cp -R /tmp/gamenav_android_shell/android ./android
          cp /tmp/gamenav_android_shell/.metadata ./.metadata

      - name: Verify GameNav source and required assets
        run: |
          set -euo pipefail

          require_file() {
            if [ ! -f "$1" ]; then
              echo "::error::MISSING FILE: $1"
              echo "Repository paths found nearby:"
              find . -maxdepth 4 -type f | sort | sed -n '1,220p'
              exit 1
            fi
            echo "OK: $1"
          }

          require_text() {
            file="$1"
            text="$2"
            if ! grep -Fq "$text" "$file"; then
              echo "::error::INVALID CONTENT: '$text' was not found in $file"
              exit 1
            fi
            echo "OK: $file contains required GameNav entry point"
          }

          require_file lib/main.dart
          require_text lib/main.dart "class GameNavApp"
          require_text lib/main.dart "runApp(const GameNavApp())"
          require_file assets/icons/vehicle.png
          require_file assets/fonts/PricedownBl.otf
          require_file platform_overrides/AndroidManifest.xml

          echo "GameNav source and assets verified."

      - name: Reject obvious secrets and cleartext URLs
        run: |
          set -euo pipefail
          if grep -R -nE 'http://' lib; then
            echo "ERROR: Cleartext HTTP URL found in application source."
            exit 1
          fi
          if grep -R -nE '(sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{30,}|gh[pousr]_[A-Za-z0-9_]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' lib; then
            echo "ERROR: Possible secret/private key found in application source."
            exit 1
          fi
          echo "Basic source security scan passed."

      - name: Get dependencies and fail on known advisories
        run: |
          set -euo pipefail
          if [ -f pubspec.lock ]; then
            flutter pub get --enforce-lockfile 2>&1 | tee /tmp/pub-get.log
          else
            echo "NOTICE: No pubspec.lock is committed yet; creating one for this build."
            flutter pub get 2>&1 | tee /tmp/pub-get.log
          fi
          if grep -Eqi 'affected by advisory|dependencies are affected by security advisories' /tmp/pub-get.log; then
            echo "ERROR: Dart/Flutter dependency security advisory detected."
            exit 1
          fi

      - name: Verify direct dependency versions
        run: |
          set -euo pipefail
          flutter pub deps --style=compact > /tmp/pub-deps.txt
          grep -F "maplibre_gl 0.26.2" /tmp/pub-deps.txt
          grep -F "geolocator 14.0.3" /tmp/pub-deps.txt
          grep -F "http 1.6.0" /tmp/pub-deps.txt
          grep -F "flutter_compass 0.8.1" /tmp/pub-deps.txt
          grep -F "wakelock_plus 1.7.0" /tmp/pub-deps.txt
          grep -F "shared_preferences 2.5.5" /tmp/pub-deps.txt

      - name: Force Android screen to stay on
        run: |
          set -euo pipefail
          MAIN_ACTIVITY="$(find android/app/src/main/kotlin -name MainActivity.kt | head -n 1)"
          test -n "$MAIN_ACTIVITY"
          PACKAGE_LINE="$(grep '^package ' "$MAIN_ACTIVITY" | head -n 1)"
          test -n "$PACKAGE_LINE"
          cat > "$MAIN_ACTIVITY" <<EOF2
          $PACKAGE_LINE

          import android.os.Bundle
          import android.view.WindowManager
          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
              }

              override fun onResume() {
                  super.onResume()
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
              }
          }
          EOF2
          echo "Patched $MAIN_ACTIVITY with FLAG_KEEP_SCREEN_ON"

      - name: Apply hardened Android manifest
        run: |
          set -euo pipefail
          cp platform_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml

      - name: Configure permanent release signing
        env:
          GAMENAV_KEYSTORE_BASE64: ${{ secrets.GAMENAV_KEYSTORE_BASE64 }}
          GAMENAV_KEYSTORE_PASSWORD: ${{ secrets.GAMENAV_KEYSTORE_PASSWORD }}
          GAMENAV_KEY_ALIAS: ${{ secrets.GAMENAV_KEY_ALIAS }}
          GAMENAV_KEY_PASSWORD: ${{ secrets.GAMENAV_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          [ -n "$GAMENAV_KEYSTORE_BASE64" ] || { echo "::error::Missing GitHub secret GAMENAV_KEYSTORE_BASE64"; exit 1; }
          [ -n "$GAMENAV_KEYSTORE_PASSWORD" ] || { echo "::error::Missing GitHub secret GAMENAV_KEYSTORE_PASSWORD"; exit 1; }
          [ -n "$GAMENAV_KEY_ALIAS" ] || { echo "::error::Missing GitHub secret GAMENAV_KEY_ALIAS"; exit 1; }
          [ -n "$GAMENAV_KEY_PASSWORD" ] || { echo "::error::Missing GitHub secret GAMENAV_KEY_PASSWORD"; exit 1; }

          printf '%s' "$GAMENAV_KEYSTORE_BASE64" | base64 --decode > android/app/gamenav-release.jks
          test -s android/app/gamenav-release.jks

          keytool -list \
            -keystore android/app/gamenav-release.jks \
            -storepass "$GAMENAV_KEYSTORE_PASSWORD" \
            -alias "$GAMENAV_KEY_ALIAS" >/dev/null

          python3 - <<'PY_SIGN'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          debug_line = 'signingConfig = signingConfigs.getByName("debug")'
          if debug_line not in s:
              raise SystemExit('Expected Flutter debug signing line was not found; refusing to patch blindly.')
          build_types = '    buildTypes {'
          if build_types not in s:
              raise SystemExit('buildTypes block not found in android/app/build.gradle.kts')
          signing_block = '''    signingConfigs {
              create("release") {
                  storeFile = file("gamenav-release.jks")
                  storePassword = System.getenv("GAMENAV_KEYSTORE_PASSWORD")
                  keyAlias = System.getenv("GAMENAV_KEY_ALIAS")
                  keyPassword = System.getenv("GAMENAV_KEY_PASSWORD")
              }
          }

          '''
          s = s.replace(build_types, signing_block + build_types, 1)
          s = s.replace(debug_line, 'signingConfig = signingConfigs.getByName("release")', 1)
          p.write_text(s)
          PY_SIGN

          grep -Fq 'signingConfigs.getByName("release")' android/app/build.gradle.kts
          echo "Permanent GameNav release signing configured."

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build signed release APK
        env:
          GAMENAV_KEYSTORE_PASSWORD: ${{ secrets.GAMENAV_KEYSTORE_PASSWORD }}
          GAMENAV_KEY_ALIAS: ${{ secrets.GAMENAV_KEY_ALIAS }}
          GAMENAV_KEY_PASSWORD: ${{ secrets.GAMENAV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 1000))
          echo "Android versionCode: $BUILD_NUMBER"
          flutter build apk --release --build-number="$BUILD_NUMBER"

      - name: Verify APK signature and package
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          AAPT="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$APK" | grep -m1 '^package:'
          fi

      - name: Prepare direct APK download
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk GameNav-latest.apk
          test -f GameNav-latest.apk
          ls -lh GameNav-latest.apk
          sha256sum GameNav-latest.apk

      - name: Publish direct APK in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="latest-build"

          # Recreate the fixed release/tag so it always points at this exact build.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          gh release create "$TAG" GameNav-latest.apk \
            --target "$GITHUB_SHA" \
            --title "GameNav Latest APK" \
            --notes "Permanently signed GameNav APK from commit $GITHUB_SHA. Future builds using the same signing key can update this install in place."

          echo "Direct APK release published."

      - name: Add direct APK link to build summary
        run: |
          {
            echo "## GameNav APK ready"
            echo
            echo "[Download GameNav-latest.apk](https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-build/GameNav-latest.apk)"
            echo
            echo "This APK is signed with the permanent GameNav release key and future builds can update it in place."
          } >> "$GITHUB_STEP_SUMMARY"

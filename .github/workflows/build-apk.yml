name: Build GameNav APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Java
        run: java -version

      - name: Create Android project
        run: flutter create --platforms=android --org=com.gamenav --project-name gamenav .

      - name: Remove generated Flutter test
        run: |
          rm -rf test
          echo "Generated Flutter test removed"

      - name: Get dependencies
        run: flutter pub get

      - name: Apply Android permissions
        run: cp platform_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameNav-APK-v0.4
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
